[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sglkit"
version = "0.1.0"
description = "Reproducible Solar Gravitational Lens imaging experiments in Python."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Syed Hussain Ather"}
]
keywords = ["solar gravitational lens", "exoplanet imaging", "inverse problems", "diffraction", "scientific computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.0"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/HussainAther/sglkit"
Repository = "https://github.com/HussainAther/sglkit"
Issues = "https://github.com/HussainAther/sglkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
